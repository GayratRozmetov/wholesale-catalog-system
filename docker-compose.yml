services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wholesale_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
  api:
    build: ./server/WholesaleCatalog.Api
    environment:
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=wholesale_catalog;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
volumes:
  catalog_data:
